name: Bug report
description: Report a reproducible problem in HabitFlow.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve HabitFlow. Do not attach backups containing personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or device
      placeholder: Safari on iPhone / Chrome on macOS
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, recordings, or other non-sensitive context.
